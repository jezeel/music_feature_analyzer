name: music_feature_analyzer
description: A comprehensive music feature analysis package using YAMNet AI and signal processing.
version: 1.0.1-beta-07

homepage: https://github.com/jezeel/music_feature_analyzer
repository: https://github.com/jezeel/music_feature_analyzer
issue_tracker: https://github.com/jezeel/music_feature_analyzer/issues

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  ffmpeg_kit_flutter_new: ^4.1.0
  path_provider: ^2.1.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  logger: ^2.3.0
  image: ^4.1.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.5
  freezed: ^3.2.4
  json_serializable: ^6.11.4

flutter:
  plugin:
    platforms:
      android:
        package: com.music_feature_analyzer
        pluginClass: MusicFeatureAnalyzerPlugin
      ios:
        pluginClass: MusicFeatureAnalyzerPlugin
  assets:
    - assets/models/
