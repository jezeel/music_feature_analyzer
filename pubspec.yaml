name: music_feature_analyzer
description: Flutter package to extract song metadata and AI-powered music features from audio files. Get title, artist, album, duration, bitrate, album art, genre, and more on Android & iOS.
version: 1.0.3

topics:
  - audio
  - metadata
  - music
  - music-player
  - song

homepage: https://github.com/jezeel/music_feature_analyzer
repository: https://github.com/jezeel/music_feature_analyzer
issue_tracker: https://github.com/jezeel/music_feature_analyzer/issues

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  ffmpeg_kit_flutter_new: ^4.1.0
  path_provider: ^2.1.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  logger: ^2.3.0
  image: ^4.1.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.10.5
  freezed: ^3.2.4
  json_serializable: ^6.11.4

flutter:
  plugin:
    platforms:
      android:
        package: com.music_feature_analyzer
        pluginClass: MusicFeatureAnalyzerPlugin
      ios:
        pluginClass: MusicFeatureAnalyzerPlugin
  assets:
    - assets/models/
